name: Refresh data and publish site

# Three ways this runs:
#   1. On a schedule — the source dataset is published quarterly, so monthly
#      polling picks up new data within weeks of it landing without being wasteful.
#   2. Manually — the "Run workflow" button, for when you want it now.
#   3. On push to main — so a code change rebuilds and redeploys.
on:
  schedule:
    - cron: "0 6 5 * *"       # 06:00 UTC on the 5th of each month
  workflow_dispatch:
  push:
    branches: [main]
    # brief.py and its workflow have nothing to do with the site. An edit to
    # either used to trigger this eighteen-minute rebuild and skip the checks
    # that actually cover them. checks.yml runs on every push and covers all of
    # it in about fifteen seconds.
    paths-ignore:
      - "**.md"
      - "brief.py"
      - ".github/workflows/brief.yml"
      - ".github/workflows/checks.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two refreshes at once — they would fight over the Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # full ingest is ~20 min; generous headroom

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fail loudly rather than publishing a placeholder domain. Without this,
      # forgetting to set SITE_URL produces a sitemap full of example.com URLs
      # that Search Console rejects — the site would look fine and never index.
      # Runs FIRST so a misconfiguration costs seconds, not a 20-minute download.
      - name: Require SITE_URL to be configured
        run: |
          if [ -z "${{ vars.SITE_URL }}" ]; then
            echo "::error::SITE_URL repository variable is not set."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            echo "Value should be your published URL, e.g. https://user.github.io/repo"
            exit 1
          fi
          echo "Building for ${{ vars.SITE_URL }}"

      # No pip install step: everything is Python standard library, on purpose.
      # Zero dependencies means nothing can break from an upstream package change.
      - name: Verify transform logic before touching the network
        run: python3 ingest.py --self-test

      # checks.yml runs on every push: compile, both self-tests, and the whole
      # pipeline against the fixture, in under a minute. It is not duplicated
      # here. py_compile stays because this workflow also runs on a schedule,
      # when no push has happened and checks.yml has not run.
      - name: Compile every module
        run: python3 -m py_compile ingest.py build_site.py audit.py brief.py

      # The ingest downloads 1.3 million rows and takes about 14 minutes. The
      # build that follows it takes 3 seconds. So a push that only changes how
      # a page looks was paying 14 minutes to fetch data it did not need — and
      # every failed attempt paid it again.
      #
      # The source dataset is published quarterly and this workflow polls it
      # monthly on the 5th, so within one calendar month the data does not
      # change. Cache the processed pipeline for the month and reuse it on
      # pushes. Scheduled and manual runs always re-download, because those are
      # the runs whose whole purpose is to refresh the data.
      #
      # The key includes a hash of ingest.py: that file decides the shape of
      # the JSON, so a change to it must invalidate the cache. Without that,
      # this very commit — which adds comments_en — would have built against a
      # cached file that has no such field.
      - name: Work out the dataset cache key
        id: cachekey
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Reuse this month's processed dataset if we have it
        if: github.event_name == 'push'
        id: pipeline-cache
        uses: actions/cache@v4
        with:
          path: recompete_pipeline.json
          key: pipeline-${{ steps.cachekey.outputs.month }}-${{ hashFiles('ingest.py') }}

      - name: Download and process contract data
        if: github.event_name != 'push' || steps.pipeline-cache.outputs.cache-hit != 'true'
        run: python3 ingest.py --full --pipeline-out recompete_pipeline.json

      # A cache hit means the audit's plausibility floors run against data that
      # was verified on the run that produced it. Say so in the log, so a fast
      # build is never mistaken for a skipped one.
      - name: Report which dataset was used
        run: |
          if [ "${{ steps.pipeline-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Using cached dataset for ${{ steps.cachekey.outputs.month }}."
          else
            echo "Downloaded a fresh dataset."
          fi
          test -s recompete_pipeline.json

      # The signup form only renders if ALL of --signup-action, --business-name
      # and --mailing-address are supplied. That is deliberate: a form posting
      # nowhere loses signups silently, and a consent request without the sender
      # identification and mailing address is itself a CASL violation. Missing
      # any of them fails the build rather than publishing something broken.
      # These values are public by design — they appear on every page.
      - name: Build the site
        run: |
          python3 build_site.py \
            --input recompete_pipeline.json \
            --out site \
            --base-url "${{ vars.SITE_URL }}" \
            --signup-action "https://app.kit.com/forms/9791323/subscriptions" \
            --business-name "Canadian Recompete Radar" \
            --mailing-address "PO Box 1184, Pembroke, Ontario K8A 6Y6"

      # THE SAFETY GATE. audit.py exits non-zero on any failure, which fails the
      # job, which means nothing deploys. A bad refresh cannot reach the public
      # site — it stops here and you get an email.
      - name: Audit the built site against the source data
        run: python3 audit.py --input recompete_pipeline.json --site site

      # Google Search Console verification. The site directory is rebuilt from
      # scratch every run, so a file uploaded once would be deleted at the next
      # refresh and Google would silently un-verify the property — most likely
      # noticed only when the traffic never arrived. Copying it in on every run
      # makes that impossible. Runs AFTER the audit so the auditor only ever
      # sees pages the generator produced.
      - name: Restore Search Console verification file
        run: |
          cp google769a0788f8481792.html site/
          test -s site/google769a0788f8481792.html

      # The custom domain. GitHub stores this in repo settings, but an
      # Actions-built site replaces the whole published tree on every deploy,
      # and a deploy without a CNAME can drop the domain — which would silently
      # send every visitor back to the github.io address. Writing it on each
      # build makes that impossible.
      - name: Set the custom domain
        run: |
          echo "recompeteradar.ca" > site/CNAME
          test -s site/CNAME

      - name: Keep the dataset as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: recompete-pipeline-json
          path: recompete_pipeline.json
          retention-days: 90

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build              # only runs if build AND audit succeeded
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
