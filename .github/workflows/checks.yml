name: Checks

# Runs on every push and every pull request, over every file, in about fifteen
# seconds. It never touches the network: the committed fixture stands in for the
# real dataset. This exists because three code errors in a row each cost a full
# eighteen-minute run before anything exercised the code. Cheap checks first.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile every module
        run: python3 -m py_compile ingest.py build_site.py audit.py brief.py

      - name: Verify transform logic
        run: python3 ingest.py --self-test

      - name: Verify the brief renders correctly
        run: python3 brief.py --self-test

      # The real pipeline, end to end, against the committed fixture. ingest
      # --from-file swaps the network for a local file and changes nothing else,
      # so this is the same code that runs in production. The date shift keeps
      # the frozen fixture inside the recompete window; without it the check
      # would decay into a no-op as the snapshot aged.
      #
      # buyer_name is already REDACTED in the fixture and ingest aborts if it
      # ever reaches the pipeline file, so nothing personal is produced here.
      # The CASL and endpoint values are throwaway and never reach the site.
      - name: Smoke test the whole pipeline against the fixture
        run: |
          python3 ingest.py \
            --from-file fixture_contracts.json \
            --shift-dates-years 3 \
            --pipeline-out /tmp/smoke-pipeline.json

          python3 build_site.py \
            --input /tmp/smoke-pipeline.json \
            --out /tmp/smoke-site \
            --base-url "https://example.invalid" \
            --signup-action "https://app.kit.com/forms/9791323/subscriptions" \
            --business-name "Smoke Test" \
            --mailing-address "1 Test St, Testville, Ontario A1A 1A1"

          python3 audit.py \
            --input /tmp/smoke-pipeline.json \
            --site /tmp/smoke-site \
            --allow-small
