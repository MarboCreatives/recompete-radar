name: Checks

# Runs on every push and every pull request, over every file, in about fifteen
# seconds. It never touches the network: the committed fixture stands in for the
# real dataset. This exists because three code errors in a row each cost a full
# eighteen-minute run before anything exercised the code. Cheap checks first.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile every module
        run: python3 -m py_compile ingest.py build_site.py audit.py brief.py

      - name: Verify transform logic
        run: python3 ingest.py --self-test

      - name: Verify the brief renders correctly
        run: python3 brief.py --self-test

      # The real builder and the real gate, run against the committed fixture of
      # 110 rows. buyer_name is already REDACTED in that file, so this publishes
      # nothing. The values below only have to satisfy the CASL and endpoint
      # validation; they never reach the live site.
      - name: Smoke test the build and the audit against the fixture
        run: |
          python3 build_site.py \
            --input fixture_contracts.json \
            --out /tmp/smoke-site \
            --base-url "https://example.invalid" \
            --signup-action "https://app.kit.com/forms/9791323/subscriptions" \
            --business-name "Smoke Test" \
            --mailing-address "1 Test St, Testville, Ontario A1A 1A1"
          python3 audit.py --input fixture_contracts.json --site /tmp/smoke-site
